name: Stock Bot Pro

"on":
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        env:
          STOCK_CONFIG: ${{ secrets.STOCK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            cat > config.py <<PY
          TOKEN = "$TELEGRAM_TOKEN"
          CHAT_ID = "$TELEGRAM_CHAT_ID"
          SUPABASE_URL = "$SUPABASE_URL"
          SUPABASE_KEY = "$SUPABASE_KEY"
          SUPABASE_SERVICE_ROLE_KEY = "$SUPABASE_SERVICE_ROLE_KEY"
          SERVICE_ROLE_KEY = SUPABASE_SERVICE_ROLE_KEY
          PY
          elif [ -n "$STOCK_CONFIG" ]; then
            # 中文註釋：v19.0 兼容舊的 STOCK secret，但優先使用拆分後的明確設定。
            printf '%s\n' "$STOCK_CONFIG" > config.py
            if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              cat >> config.py <<PY
          SUPABASE_SERVICE_ROLE_KEY = "$SUPABASE_SERVICE_ROLE_KEY"
          SERVICE_ROLE_KEY = SUPABASE_SERVICE_ROLE_KEY
          PY
            fi
          else
            echo "Missing GitHub Secrets: configure TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, SUPABASE_URL, SUPABASE_KEY"
            exit 1
          fi

          python - <<'PY'
          import config

          required = [
              name for name, value in {
                  "TOKEN": getattr(config, "TOKEN", ""),
                  "CHAT_ID": getattr(config, "CHAT_ID", ""),
                  "SUPABASE_URL": getattr(config, "SUPABASE_URL", ""),
                  "SUPABASE_KEY": getattr(config, "SUPABASE_KEY", "")
              }.items()
              if not value
          ]
          service_role_key = getattr(config, "SUPABASE_SERVICE_ROLE_KEY", "")
          service_role_alias = getattr(config, "SERVICE_ROLE_KEY", "")
          statuses = {
              "SUPABASE_URL": getattr(config, "SUPABASE_URL", ""),
              "SUPABASE_KEY": getattr(config, "SUPABASE_KEY", ""),
              "SUPABASE_SERVICE_ROLE_KEY": service_role_key,
              "SERVICE_ROLE_KEY alias": service_role_alias,
          }
          for name, value in statuses.items():
              state = "present" if value else "missing"
              print(f"runtime config: {name} {state}")
          if required:
              raise SystemExit(f"Missing runtime config: {', '.join(required)}")
          PY

      - name: Backfill official market/theme evidence (retry 3 times)
        run: |
          success=0
          for i in 1 2 3
          do
            if python scripts/backfill_market_theme_sources.py --write --confirm-write; then
              success=1
              break
            fi
            echo "Market/theme evidence backfill retry $i failed..."
            sleep 5
          done
          test "$success" -eq 1

      - name: Run bot (retry 3 times)
        run: |
          success=0
          for i in 1 2 3
          do
            if python main.py; then
              success=1
              break
            fi
            echo "Retry $i failed..."
            sleep 5
          done
          test "$success" -eq 1
