name: Stock Bot Pro

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "bot, daily_evidence, backfill_may, or backfill_and_bot"
        required: false
        default: "bot"
        type: choice
        options:
          - bot
          - daily_evidence
          - backfill_may
          - backfill_and_bot
      start_date:
        description: "Backfill start date, YYYY-MM-DD"
        required: false
        default: "2026-05-01"
      end_date:
        description: "Backfill end date, YYYY-MM-DD"
        required: false
        default: "2026-05-29"
      backfill_version:
        description: "Strategy version for signal/evidence backfill"
        required: false
        default: "v20.4.5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || (github.event_name == 'schedule' && 'daily_evidence') || 'bot' }}
          STOCK_CONFIG: ${{ secrets.STOCK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$RUN_MODE" = "daily_evidence" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            cat > config.py <<PY
          TOKEN = ""
          CHAT_ID = ""
          SUPABASE_URL = "$SUPABASE_URL"
          SUPABASE_KEY = "$SUPABASE_KEY"
          SUPABASE_SERVICE_ROLE_KEY = "$SUPABASE_SERVICE_ROLE_KEY"
          SERVICE_ROLE_KEY = SUPABASE_SERVICE_ROLE_KEY
          PY
          elif [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            cat > config.py <<PY
          TOKEN = "$TELEGRAM_TOKEN"
          CHAT_ID = "$TELEGRAM_CHAT_ID"
          SUPABASE_URL = "$SUPABASE_URL"
          SUPABASE_KEY = "$SUPABASE_KEY"
          SUPABASE_SERVICE_ROLE_KEY = "$SUPABASE_SERVICE_ROLE_KEY"
          SERVICE_ROLE_KEY = SUPABASE_SERVICE_ROLE_KEY
          PY
          elif [ -n "$STOCK_CONFIG" ]; then
            # 中文註釋：v19.0 兼容舊的 STOCK secret，但優先使用拆分後的明確設定。
            printf '%s\n' "$STOCK_CONFIG" > config.py
            if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              cat >> config.py <<PY
          SUPABASE_SERVICE_ROLE_KEY = "$SUPABASE_SERVICE_ROLE_KEY"
          SERVICE_ROLE_KEY = SUPABASE_SERVICE_ROLE_KEY
          PY
            fi
          else
            echo "Missing GitHub Secrets: configure TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, SUPABASE_URL, SUPABASE_KEY"
            exit 1
          fi

          python - <<'PY'
          import os
          import config

          run_mode = os.environ.get("RUN_MODE", "bot")
          needs_telegram = run_mode not in {"daily_evidence"}
          required = [
              name for name, value in {
                  **({"TOKEN": getattr(config, "TOKEN", ""), "CHAT_ID": getattr(config, "CHAT_ID", "")} if needs_telegram else {}),
                  "SUPABASE_URL": getattr(config, "SUPABASE_URL", ""),
                  "SUPABASE_KEY": getattr(config, "SUPABASE_KEY", "")
              }.items()
              if not value
          ]
          service_role_key = getattr(config, "SUPABASE_SERVICE_ROLE_KEY", "")
          service_role_alias = getattr(config, "SERVICE_ROLE_KEY", "")
          statuses = {
              "SUPABASE_URL": getattr(config, "SUPABASE_URL", ""),
              "SUPABASE_KEY": getattr(config, "SUPABASE_KEY", ""),
              "SUPABASE_SERVICE_ROLE_KEY": service_role_key,
              "SERVICE_ROLE_KEY alias": service_role_alias,
          }
          for name, value in statuses.items():
              state = "present" if value else "missing"
              print(f"runtime config: {name} {state}")
          if required:
              raise SystemExit(f"Missing runtime config: {', '.join(required)}")
          PY

      - name: Backfill official market/theme evidence (retry 3 times)
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'bot' }}
          BACKFILL_START_DATE: ${{ github.event.inputs.start_date || '2026-05-01' }}
          BACKFILL_END_DATE: ${{ github.event.inputs.end_date || '2026-05-29' }}
        run: |
          if [ "$RUN_MODE" = "backfill_may" ] || [ "$RUN_MODE" = "backfill_and_bot" ]; then
            echo "May market/theme evidence backfill enabled for run_mode=$RUN_MODE"
          else
            echo "May market/theme evidence backfill skipped for run_mode=$RUN_MODE"
            exit 0
          fi
          success=0
          for i in 1 2 3
          do
            if python scripts/backfill_market_theme_sources.py \
              --historical-range \
              --start-date "$BACKFILL_START_DATE" \
              --end-date "$BACKFILL_END_DATE" \
              --write \
              --confirm-write; then
              success=1
              break
            fi
            echo "Market/theme evidence backfill retry $i failed..."
            sleep 5
          done
          test "$success" -eq 1

      - name: Backfill May signal and strategy evidence
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'bot' }}
          BACKFILL_START_DATE: ${{ github.event.inputs.start_date || '2026-05-01' }}
          BACKFILL_END_DATE: ${{ github.event.inputs.end_date || '2026-05-29' }}
          BACKFILL_VERSION: ${{ github.event.inputs.backfill_version || 'v20.4.5' }}
        run: |
          if [ "$RUN_MODE" != "backfill_may" ] && [ "$RUN_MODE" != "backfill_and_bot" ]; then
            echo "May backfill skipped for run_mode=$RUN_MODE"
            exit 0
          fi
          python scripts/backfill_signals.py \
            --start-date "$BACKFILL_START_DATE" \
            --end-date "$BACKFILL_END_DATE" \
            --version "$BACKFILL_VERSION" \
            --source twse \
            --allow-partial \
            --write \
            --confirm-write

      - name: Run Phase 3 evidence automation
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || (github.event_name == 'schedule' && 'daily_evidence') || 'bot' }}
          MARKET_THEME_APPROVED_PAYLOAD: ${{ secrets.MARKET_THEME_APPROVED_PAYLOAD }}
        run: |
          if [ "$RUN_MODE" != "daily_evidence" ] && [ "$RUN_MODE" != "backfill_and_bot" ]; then
            echo "Phase 3 evidence automation skipped for run_mode=$RUN_MODE"
            exit 0
          fi
          payload_arg=""
          if [ -n "$MARKET_THEME_APPROVED_PAYLOAD" ]; then
            printf '%s\n' "$MARKET_THEME_APPROVED_PAYLOAD" > market_theme_approved_payload.json
            payload_arg="--market-theme-payload market_theme_approved_payload.json"
          fi
          python scripts/run_phase3_evidence_automation.py --require-market-theme-payload $payload_arg

      - name: Run bot (retry 3 times)
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || (github.event_name == 'schedule' && 'daily_evidence') || 'bot' }}
        run: |
          if [ "$RUN_MODE" != "bot" ] && [ "$RUN_MODE" != "backfill_and_bot" ]; then
            echo "Run bot skipped for run_mode=$RUN_MODE"
            exit 0
          fi
          success=0
          for i in 1 2 3
          do
            if python main.py; then
              success=1
              break
            fi
            echo "Retry $i failed..."
            sleep 5
          done
          test "$success" -eq 1
