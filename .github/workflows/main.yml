name: Stock Bot Pro

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        env:
          STOCK_CONFIG: ${{ secrets.STOCK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$STOCK_CONFIG" ]; then
            printf '%s\n' "$STOCK_CONFIG" > config.py
          else
            cat > config.py <<PY
          TOKEN = "$TELEGRAM_TOKEN"
          CHAT_ID = "$TELEGRAM_CHAT_ID"
          SUPABASE_URL = "$SUPABASE_URL"
          SUPABASE_KEY = "$SUPABASE_KEY"
          PY
          fi

          python - <<'PY'
          from config import TOKEN, CHAT_ID, SUPABASE_URL, SUPABASE_KEY
          missing = [
              name for name, value in {
                  "TOKEN": TOKEN,
                  "CHAT_ID": CHAT_ID,
                  "SUPABASE_URL": SUPABASE_URL,
                  "SUPABASE_KEY": SUPABASE_KEY
              }.items()
              if not value
          ]
          if missing:
              raise SystemExit(f"Missing runtime config: {', '.join(missing)}")
          PY

      - name: Run bot (retry 3 times)
        run: |
          success=0
          for i in 1 2 3
          do
            if python main.py; then
              success=1
              break
            fi
            echo "Retry $i failed..."
            sleep 5
          done
          test "$success" -eq 1
